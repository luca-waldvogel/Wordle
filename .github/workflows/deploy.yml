name: Build and Deploy Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/luca-waldvogel/wordle-backend:latest ./backend

      - name: Push backend image
        run: docker push ghcr.io/luca-waldvogel/wordle-backend:latest

      - name: Build frontend image
        run: docker build -t ghcr.io/luca-waldvogel/wordle-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push ghcr.io/luca-waldvogel/wordle-frontend:latest

      - name: Trigger backend deploy on Render
        run: curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}

      - name: Trigger frontend deploy on Render
        run: curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
